plugins {
    id 'com.android.application'
    id 'com.google.android.gms.oss-licenses-plugin'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id "org.jetbrains.kotlin.kapt"
    id 'com.google.relay' version '0.3.09'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def cellwatchPropertiesFile = rootProject.file("cellwatch.properties")
def cellwatchProperties = new Properties()
cellwatchProperties.load(new FileInputStream(cellwatchPropertiesFile))

android {
    namespace 'edu.gatech.cc.cellwatch'
    compileSdk 34

    defaultConfig {
        applicationId "edu.gatech.cc.cellwatch"
        minSdk 29
        targetSdk 34
        versionCode 7
        versionName "1.0.0-beta.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "armeabi", "armeabi-v7a", "arm64-v8a"
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField("String", "TCP_TUPLE_URL", cellwatchProperties['TCP_TUPLE_URL'])
            buildConfigField("String", "SUPABASE_URL", cellwatchProperties['SUPABASE_LOCAL_URL'])
            buildConfigField("String", "SUPABASE_API_KEY", cellwatchProperties['SUPABASE_LOCAL_API_KEY'])
            buildConfigField("String", "MSAK_SERVER_ENV", cellwatchProperties['MSAK_SERVER_ENV'])
            buildConfigField("String", "MSAK_LOCAL_SERVER_HOST", cellwatchProperties['MSAK_LOCAL_SERVER_HOST'])
            buildConfigField("Boolean", "MSAK_LOCAL_SERVER_SECURE", cellwatchProperties['MSAK_LOCAL_SERVER_SECURE'])
            buildConfigField("Integer", "MSAK_LATENCY_PORT", cellwatchProperties['MSAK_LOCAL_LATENCY_PORT'])
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField("String", "TCP_TUPLE_URL", cellwatchProperties['TCP_TUPLE_URL'])
            buildConfigField("String", "SUPABASE_URL", cellwatchProperties['SUPABASE_URL'])
            buildConfigField("String", "SUPABASE_API_KEY", cellwatchProperties['SUPABASE_API_KEY'])
            buildConfigField("String", "MSAK_SERVER_ENV", "\"prod\"")
            buildConfigField("String", "MSAK_LOCAL_SERVER_HOST", "\"\"")
            buildConfigField("Boolean", "MSAK_LOCAL_SERVER_SECURE", "true")
            buildConfigField("Integer", "MSAK_LATENCY_PORT", cellwatchProperties['MSAK_LATENCY_PORT'])
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources.excludes.add("META-INF/LICENSE.md")
        resources.excludes.add("META-INF/LICENSE-notice.md")
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation "com.google.firebase:firebase-crashlytics"

    implementation 'commons-io:commons-io:2.13.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'androidx.test.ext:junit-ktx:1.1.5'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'
    androidTestImplementation 'io.mockk:mockk-android:1.13.8'
    androidTestImplementation 'io.mockk:mockk-agent:1.13.8'
    def room_version = "2.5.2"
    def lifecycle_version = "2.6.1"
    def nav_version = "2.4.2"

    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation files('../lib/AndroidPing.aar')
    implementation files('../lib/DeviceInformation-release.aar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'io.github.jan-tennert.supabase:postgrest-kt:1.0.3'
    implementation 'io.ktor:ktor-client-cio:2.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.0'

    implementation "com.github.nisrulz:easydeviceinfo-base:2.4.1"

    implementation('com.jaredrummler:android-device-names:2.1.1')

    implementation 'com.google.android.gms:play-services-location:21.3.0'

    implementation 'com.github.anastr:speedviewlib:1.6.0'

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    implementation 'com.mapbox.maps:android:11.3.1'
    implementation "com.mapbox.search:mapbox-search-android:2.2.0"
    implementation "com.mapbox.search:mapbox-search-android-ui:2.2.0"


    // To use Kotlin annotation processing tool (kapt)
    kapt "androidx.room:room-compiler:$room_version"

    // optional - RxJava2 support for Room
    implementation "androidx.room:room-rxjava2:$room_version"

    // optional - RxJava3 support for Room
    implementation "androidx.room:room-rxjava3:$room_version"

    // optional - Guava support for Room, including Optional and ListenableFuture
    implementation "androidx.room:room-guava:$room_version"

    // optional - Test helpers
    testImplementation "androidx.room:room-testing:$room_version"

    // optional - Paging 3 Integration
    implementation "androidx.room:room-paging:$room_version"

    implementation "androidx.datastore:datastore-preferences:1.0.0"

    implementation "com.uber:h3:3.7.2"

    implementation 'commons-validator:commons-validator:1.7'
    implementation 'com.google.android.gms:play-services-oss-licenses:17.0.1'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation "androidx.core:core-ktx:1.13.1"
    implementation 'com.github.CellWatch:msak-android:0.1.3'
}
