name: iosSharedIntegrationHost
options:
  bundleIdPrefix: edu.gatech.cc.cellwatch
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  iosSharedIntegrationHost:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.gatech.cc.cellwatch.iosSharedIntegrationHost
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - framework: ../shared/build/bin/Current/sharedKit.framework
    preBuildScripts:
      - name: Build shared framework
        script: |
          set -euo pipefail
          "$SRCROOT/../scripts/compile-shared-framework-for-xcode.sh"
  iosSharedIntegrationHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.gatech.cc.cellwatch.iosSharedIntegrationHostTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosSharedIntegrationHost.app/iosSharedIntegrationHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: iosSharedIntegrationHost
      - framework: ../shared/build/bin/Current/sharedKit.framework
schemes:
  iosSharedIntegrationHost:
    build:
      targets:
        iosSharedIntegrationHost: all
        iosSharedIntegrationHostTests: [test]
    test:
      targets:
        - iosSharedIntegrationHostTests
      gatherCoverageData: false
