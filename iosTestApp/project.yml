name: iosTestApp
options:
  bundleIdPrefix: edu.gatech.cc.cellwatch
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  iosTestApp:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.gatech.cc.cellwatch
        INFOPLIST_FILE: App/Info.plist
      configs:
        Debug:
          CELLWATCH_DISABLE_SUPABASE_SYNC: NO
          CELLWATCH_ALLOW_REMOTE_SUPABASE: NO
          CELLWATCH_DEFAULT_MSAK_MODE: LOCAL
          CELLWATCH_DEFAULT_SUPABASE_MODE: LOCAL
        Release:
          CELLWATCH_DISABLE_SUPABASE_SYNC: NO
          CELLWATCH_ALLOW_REMOTE_SUPABASE: YES
          CELLWATCH_DEFAULT_MSAK_MODE: PUBLIC
          CELLWATCH_DEFAULT_SUPABASE_MODE: TESTING
    dependencies:
      - framework: ../shared/build/bin/Current/sharedKit.framework
    preBuildScripts:
      - name: Build shared framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "$SRCROOT/../scripts/compile-shared-framework-for-xcode.sh"
  iosTestAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - TestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.gatech.cc.cellwatchTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosTestApp.app/iosTestApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: iosTestApp
      - framework: ../shared/build/bin/Current/sharedKit.framework
  iosTestAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - TestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.gatech.cc.cellwatchUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iosTestApp
    dependencies:
      - target: iosTestApp
schemes:
  iosTestApp:
    build:
      targets:
        iosTestApp: all
        iosTestAppTests: [test]
    test:
      targets:
        - iosTestAppTests
      gatherCoverageData: false
  iosTestAppLocalMsakSmoke:
    build:
      targets:
        iosTestApp: all
        iosTestAppTests: [test]
    test:
      targets:
        - iosTestAppTests
      gatherCoverageData: false
  iosTestAppUiSmoke:
    build:
      targets:
        iosTestApp: all
        iosTestAppUITests: [test]
    test:
      targets:
        - iosTestAppUITests
      gatherCoverageData: false
