name: iosTestApp
options:
  bundleIdPrefix: edu.gatech.cc.cellwatch
  deploymentTarget:
    iOS: '17.0'
configs:
  Debug: debug
  # AppStore is a release-type configuration that selects LIVE Supabase. It
  # exists so a store submission is a matter of archiving the right
  # configuration rather than remembering a command-line override.
  Release: release
  AppStore: release
settings:
  base:
    DEVELOPMENT_TEAM: LECSLW6UDQ
    SWIFT_VERSION: 5.0
packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.18.1
targets:
  iosTestApp:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: edu.gatech.cc.cellwatch
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Debug:
          CELLWATCH_DISABLE_SUPABASE_SYNC: NO
          CELLWATCH_ALLOW_REMOTE_SUPABASE: NO
          CELLWATCH_DEFAULT_MSAK_MODE: LOCAL
          CELLWATCH_DEFAULT_SUPABASE_MODE: LOCAL
        Release:
          CELLWATCH_DISABLE_SUPABASE_SYNC: NO
          CELLWATCH_ALLOW_REMOTE_SUPABASE: YES
          CELLWATCH_DEFAULT_MSAK_MODE: PUBLIC
          CELLWATCH_DEFAULT_SUPABASE_MODE: TESTING
        AppStore:
          CELLWATCH_DISABLE_SUPABASE_SYNC: NO
          CELLWATCH_ALLOW_REMOTE_SUPABASE: YES
          CELLWATCH_ALLOW_LIVE_SUPABASE: YES
          CELLWATCH_DEFAULT_MSAK_MODE: PUBLIC
          CELLWATCH_DEFAULT_SUPABASE_MODE: LIVE
    dependencies:
      - package: MapboxMaps
      - framework: ../shared/build/bin/Current/sharedKit.framework
    preBuildScripts:
      - name: Build shared framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "$SRCROOT/../scripts/compile-shared-framework-for-xcode.sh"
  iosTestAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - TestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.gatech.cc.cellwatchTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosTestApp.app/iosTestApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: iosTestApp
      - framework: ../shared/build/bin/Current/sharedKit.framework
  iosTestAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - TestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.gatech.cc.cellwatchUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iosTestApp
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: iosTestApp
schemes:
  iosTestAppAppStore:
    build:
      targets:
        iosTestApp: [archive, run, profile, analyze]
    run:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
  iosTestApp:
    build:
      targets:
        iosTestApp: all
        iosTestAppTests: [test]
    test:
      targets:
        - iosTestAppTests
      gatherCoverageData: false
  iosTestAppLocalMsakSmoke:
    build:
      targets:
        iosTestApp: all
        iosTestAppTests: [test]
    test:
      targets:
        - iosTestAppTests
      gatherCoverageData: false
  iosTestAppUiSmoke:
    build:
      targets:
        iosTestApp: all
        iosTestAppUITests: [test]
    test:
      targets:
        - iosTestAppUITests
      gatherCoverageData: false
